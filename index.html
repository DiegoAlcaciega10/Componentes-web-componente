<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de producto</title>
    <link rel="stylesheet" href="./estilos.css">
</head>
<style>
    tarjeta-producto {
        --borde: gold;
        --titulo: navy;
    }
    
    tarjeta-ian {
        --color-marca: #10b981;
    }
</style>

<body>

    <tarjeta-diego precio=0.45>
        <img slot="foto" src="img/agua_vivant.png">
        <h3 slot="nombre">Agua Vivant</h3>
        <p>¡Saca lo mejor de ti!</p>
    </tarjeta-diego>



    <tarjeta-ian precio="2.50" destacado>
        <img slot="foto" src="img/jugonaranja.png" alt="Jugo Natural de Naranja fresco">
        <h3 slot="nombre">Jugo Natural de Naranja</h3>
        <p>Exprimido al instante, 100% natural, lleno de vitamina C y frescura pura.</p>
    </tarjeta-ian>

    <script type="module" src="components/tarjeta-diego.js"></script>
    <script type="module" src="components/tarjeta-producto-ian.js"></script>

</body>

</html>
